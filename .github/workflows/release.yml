name: Release

# Publishing a GitHub release builds every download and attaches it to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet run --project tests/KeepGreen.Tests -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.event.release.tag_name }}'.TrimStart('v')
          $common = @('src/KeepGreen/KeepGreen.csproj', '-c', 'Release', '-r', 'win-x64', '-p:PublishSingleFile=true', '-p:DebugType=none', "-p:Version=$version")
          dotnet publish @common --self-contained false -o out/portable
          dotnet publish @common --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/standalone
          Copy-Item out/portable/KeepGreen.exe KeepGreen-win-x64.exe
          Copy-Item out/standalone/KeepGreen.exe KeepGreen-win-x64-standalone.exe

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" KeepGreen-win-x64.exe KeepGreen-win-x64-standalone.exe --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate
          version='${{ github.event.release.tag_name }}'
          xcodebuild -quiet -project KeepGreen.xcodeproj -scheme KeepGreenMac -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            MARKETING_VERSION="${version#v}" CODE_SIGNING_ALLOWED=NO build
          # Ad-hoc sign so Apple silicon Macs will launch it; it is not notarized.
          codesign --force --deep --sign - build/Build/Products/Release/KeepGreen.app
          ditto -c -k --keepParent build/Build/Products/Release/KeepGreen.app ../KeepGreen-macos.zip

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" KeepGreen-macos.zip --clobber

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # A debug-signed APK installs by sideloading. Play Store builds need a release key, kept out of this repo.
      - name: Build
        working-directory: android
        run: |
          gradle testDebugUnitTest assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../KeepGreen-android.apk

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" KeepGreen-android.apk --clobber
