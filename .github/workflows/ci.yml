name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build KeepGreen.slnx -c Release

      - name: Test
        run: dotnet run --project tests/KeepGreen.Tests -c Release --no-build

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test KeepGreenKit
        working-directory: apple/KeepGreenKit
        run: swift test

      - name: Generate Xcode project
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build macOS app
        working-directory: apple
        run: xcodebuild -quiet -project KeepGreen.xcodeproj -scheme KeepGreenMac -configuration Release -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build

      - name: Build iOS app
        working-directory: apple
        run: xcodebuild -quiet -project KeepGreen.xcodeproj -scheme KeepGreenRemote -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build and test
        working-directory: android
        run: gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: KeepGreen-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
